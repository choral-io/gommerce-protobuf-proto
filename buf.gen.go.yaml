# yaml-language-server: $schema=https://json.schemastore.org/buf.gen.json
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.1
    out: ../gommerce-protobuf-go
    opt:
      - module=github.com/choral-io/gommerce-protobuf-go
  - remote: buf.build/bufbuild/validate-go:v1.1.0
    out: ../gommerce-protobuf-go
    opt:
      - module=github.com/choral-io/gommerce-protobuf-go
  - remote: buf.build/grpc/go:v1.5.1
    out: ../gommerce-protobuf-go
    opt:
      - module=github.com/choral-io/gommerce-protobuf-go
  - remote: buf.build/grpc-ecosystem/gateway:v2.25.1
    out: ../gommerce-protobuf-go
    opt:
      - module=github.com/choral-io/gommerce-protobuf-go
      - generate_unbound_methods=true
