# yaml-language-server: $schema=https://json.schemastore.org/buf.gen.json
version: v2
plugins:
  - remote: buf.build/bufbuild/es:v2.4.0
    out: .build/gommerce-protobuf-es
    opt:
      - json_types=true
      - target=js+dts
      - import_extension=.js
      - keep_empty_files=false
    include_imports: true
