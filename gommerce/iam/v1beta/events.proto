syntax = "proto3";

package gommerce.iam.v1beta;

option csharp_namespace = "Gommerce.Proto.IAM.V1Beta";
option go_package = "github.com/choral-io/gommerce-protobuf-go/iam/v1beta;iam_v1beta";
option java_package = "io.choral.gommerce.proto.iam.v1beta";

message UserCreatedEvent {
  string realm = 1;
  string user_id = 2;
}

message UserUpdatedEvent {
  string realm = 1;
  string user_id = 2;
}

message UserActivatedEvent {
  string realm = 1;
  string user_id = 2;
}

message UserLoggedInEvent {
  string realm = 1;
  string user_id = 2;
  string provider = 3;
  string identifier = 4;
}
