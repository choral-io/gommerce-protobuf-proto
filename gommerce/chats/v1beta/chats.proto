syntax = "proto3";
package gommerce.chats.v1beta;

import "gommerce/types/v1/gender.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "validate/validate.proto";

option csharp_namespace = "Gommerce.Proto.Chats.V1Beta";
option go_package = "github.com/choral-io/gommerce-protobuf-go/chats/v1beta;chats_v1beta";

service ChatsService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {}
  rpc DescribeSession(DescribeSessionRequest) returns (DescribeSessionResponse) {}
  rpc ReadSession(ReadSessionRequest) returns (ReadSessionResponse) {}
  rpc SendRecord(SendRecordRequest) returns (SendRecordResponse) {}
  rpc WatchRecords(WatchRecordsRequest) returns (stream WatchRecordsResponse) {}
}

message Member {
  string user_id = 1;
  string session_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int64 permission = 5;
  gommerce.types.v1.Gender gender = 6;
  string display_name = 7;
  google.protobuf.StringValue avatar_url = 8;
}

message Record {
  string id = 1;
  string session_id = 2;
  string creator_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
  string version = 7;
  map<string, string> headers = 8;
  bytes content = 9;
}

message Session {
  string id = 1;
  bool readonly = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  google.protobuf.Timestamp deleted_at = 5;
  google.protobuf.StringValue icon_url = 6;
  string title = 7;
  google.protobuf.StringValue introduction = 8;
  repeated Member members = 9;
  Record last_record = 10;
  google.protobuf.StringValue read_cursor = 11;
}

message ListSessionsRequest {
  int32 page = 1 [(validate.rules).int32 = {gte: 0}];
  int32 size = 2 [(validate.rules).int32 = {gte: 1}];
  string sort = 3;
}

message ListSessionsResponse {
  repeated Session items = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total = 4;
}

message DescribeSessionRequest {
  string session_id = 1;
}

message DescribeSessionResponse {
  Session item = 1;
}

message ReadSessionRequest {
  string session_id = 1;
  google.protobuf.StringValue read_cursor = 2;
}

message ReadSessionResponse {}

message SendRecordRequest {
  string session_id = 1;
  map<string, string> headers = 2;
  bytes content = 3;
}

message SendRecordResponse {
  string id = 1;
}

message WatchRecordsRequest {}

message WatchRecordsResponse {
  repeated Record items = 1;
}

message RecordsCreatedEvent {
  repeated Record items = 1;
}
